name: V3 Cloud Connection
on:
  push:
    branches: [v3-historical-research]
    paths: ['.github/workflows/v3_cloud_connection.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests==2.32.5
      - run: |
          python - <<'PY'
          from research_v3.forward_cloud_ledger import CloudLedger
          c=CloudLedger()
          try:
              for table in ('fo_signals','fo_scan_status','fo_daily_performance'):
                  c.call('GET',table,{'limit':1})
                  print(table, 'READ OK')
          finally:
              c.close()
          PY
