
name: Opportunity Performance V2.9

on:
  workflow_dispatch:
    inputs:
      session_date:
        description: "Session date YYYY-MM-DD (blank = today IST)"
        required: false
        default: ""
  schedule:
    - cron: '0 12 * * 1-5'

permissions:
  contents: write

concurrency:
  group: opportunity-performance
  cancel-in-progress: false

jobs:
  performance:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install requirements
        run: |
          pip install -r requirements.txt

      - name: Calculate opportunity performance
        env:
          PERFORMANCE_DATE: ${{ inputs.session_date }}
        run: |
          python opportunity_performance_engine.py

      - name: Save permanent performance archive
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -f historical_data/opportunity_performance

          if git diff --cached --quiet; then
            echo "No archive changes"
          else
            git commit -m "Update opportunity performance archive"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
