
name: F&O Futures Intelligence Collection

on:
  workflow_dispatch:
  schedule:
    - cron: '30 14 * * 1-5'

permissions:
  contents: write

concurrency:
  group: futures-intelligence-collection
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout latest main branch
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          fi
          pip install pandas numpy requests

      - name: Run Futures Intelligence Collector
        id: collector
        continue-on-error: true
        run: |
          python futures_intelligence_engine.py

      - name: Save historical futures data
        if: always() && steps.collector.outcome != 'skipped'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          for folder in futures participant_oi fii_dii; do
            if [ -d "historical_data/nse/$folder" ]; then
              git add "historical_data/nse/$folder"
            fi
          done

          if [ -f historical_data/latest_futures_collection.json ]; then
            git add historical_data/latest_futures_collection.json
          fi

          if [ -d historical_data/logs ]; then
            git add historical_data/logs
          fi

          if git diff --cached --quiet; then
            echo "No new historical data"
          else
            git commit -m "Automatic futures intelligence collection"
            git pull --rebase origin main
            git push origin HEAD:main
          fi

      - name: Verify collection result
        if: always()
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path(
              "historical_data/latest_futures_collection.json"
          )

          if not path.exists():
              raise SystemExit("Collection summary missing")

          data = json.loads(path.read_text())

          print(json.dumps(data, indent=2))

          if "${{ steps.collector.outcome }}" != "success":
              raise SystemExit("Collector failed")

          if data.get("missing_sources"):
              raise SystemExit("Some sources unavailable")

          print("Futures collection completed")
          PY
