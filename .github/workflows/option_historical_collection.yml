
name: Option Historical Collection V2.1

on:
  workflow_dispatch:
  schedule:
    - cron: '30 13 * * 1-5'

permissions:
  contents: write

concurrency:
  group: option-historical-collection
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install numpy pandas requests streamlit

      - name: Collect option snapshots
        id: collection
        continue-on-error: true
        env:
          UPSTOX_ACCESS_TOKEN: ${{ secrets.UPSTOX_ACCESS_TOKEN }}
        run: |
          python option_quality_engine.py

      - name: Save historical data
        if: always()
        run: |
          git config user.name "FO Data Collector"
          git config user.email "actions@users.noreply.github.com"

          if [ ! -d historical_data/option_intelligence ]; then
            echo "No option snapshots available"
            exit 1
          fi

          git add historical_data/option_intelligence/

          if git diff --cached --quiet; then
            echo "No new snapshots"
          else
            git commit -m "Update validated option historical data"
            git pull --rebase origin main
            git push origin HEAD:main
          fi

      - name: Report collection status
        if: always()
        run: |
          if [ "${{ steps.collection.outcome }}" != "success" ]; then
            echo "Collection incomplete or failed"
            exit 1
          fi
