
name: F&O Daily Data Collection

on:
  workflow_dispatch:

  schedule:
    - cron: '30 2 * * *'
    - cron: '30 14 * * *'
    - cron: '30 17 * * *'

permissions:
  contents: write

concurrency:
  group: fo-daily-data-collection
  cancel-in-progress: false

jobs:
  collect:

    runs-on: ubuntu-latest

    timeout-minutes: 15

    steps:

      - name: Checkout latest main branch
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Synchronize latest repository
        run: |
          git fetch origin main
          git checkout main
          git merge --ff-only origin/main

      - name: Run daily collector
        id: collector
        continue-on-error: true
        run: python daily_collector.py

      - name: Save historical data
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if [ ! -d historical_data ]; then
            echo "Historical data folder missing"
            exit 1
          fi

          git add historical_data/

          if git diff --cached --quiet; then
            echo "No new historical data"
          else
            git commit -m "Automatic historical data collection"
            git push origin HEAD:main
          fi

      - name: Verify collection result
        if: always()
        run: |
          if [ "${{ steps.collector.outcome }}" != "success" ]; then
            echo "Collection incomplete. Check diagnostics."
            exit 1
          fi

          echo "Collection completed successfully"
