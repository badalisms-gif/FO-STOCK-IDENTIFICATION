name: V3 Forward Paper Tests
on:
  push:
    branches: [v3-historical-research]
    paths: ['.github/workflows/v3_forward_paper_test.yml','research_v3/forward_*.py','research_v3/test_forward_paper.py']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m unittest research_v3.test_forward_paper research_v3.test_forward_ledger -v
      - run: python -m compileall -q research_v3
