name: V3 Market Feed Probe
on:
  workflow_dispatch:
  schedule:
    - cron: '20 4 * * 1-5'
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      UPSTOX_ACCESS_TOKEN: ${{ secrets.UPSTOX_ACCESS_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v3-historical-research
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - run: |
          python - <<'PY'
          import os,json
          from datetime import datetime
          from zoneinfo import ZoneInfo
          from research_v3.forward_live_snapshot import snapshot
          t=datetime.now(ZoneInfo('Asia/Kolkata'))
          if t.weekday()>=5 or not 586<=t.hour*60+t.minute<=870:
              print('SKIPPED: outside market probe window')
              raise SystemExit(0)
          from live_market_engine import market_open
          token=os.environ['UPSTOX_ACCESS_TOKEN']
          if not market_open(token):
              print('SKIPPED: exchange not confirmed NORMAL_OPEN')
              raise SystemExit(0)
          d=snapshot(token)
          result={k:len(d[k]) for k in ('universe','spots','futures','indices','errors')}
          result.update(fresh=d['fresh'],elapsed_seconds=d['elapsed_seconds'])
          print('MARKET_PROBE',json.dumps(result))
          assert d['fresh'], 'snapshot too slow'
          assert len(d['spots'])>=.95*len(d['universe'])
          assert len(d['futures'])>=.95*len(d['universe'])
          assert len(d['indices'])>=12
          PY
