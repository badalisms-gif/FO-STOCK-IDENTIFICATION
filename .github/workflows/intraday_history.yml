
name: Historical Intraday Baseline V2.5.1

on:
  workflow_dispatch:
  schedule:
    - cron: '30 13 * * 1-5'

permissions:
  contents: write

concurrency:
  group: intraday-history
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install requirements
        run: |
          pip install -r requirements.txt

      - name: Collect historical minute data
        id: collect
        continue-on-error: true
        env:
          UPSTOX_ACCESS_TOKEN: ${{ secrets.UPSTOX_ACCESS_TOKEN }}
        run: |
          python intraday_history_engine.py

      - name: Save permanent baseline archive
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          ARCHIVE="historical_data/stock_intelligence/intraday_baseline"

          if [ ! -d "$ARCHIVE" ]; then
            echo "No historical archive generated"
            exit 0
          fi

          git add -f "$ARCHIVE"

          if git diff --cached --quiet; then
            echo "No archive changes"
          else
            git commit -m "Update historical intraday baseline"
            git pull --rebase origin main
            git push origin HEAD:main
          fi

      - name: Verify collection result
        if: always()
        run: |
          if [ "${{ steps.collect.outcome }}" != "success" ]; then
            echo "Historical collection failed"
            exit 1
          fi

          echo "Historical collection completed"
